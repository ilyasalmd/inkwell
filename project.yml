name: Inkwell
options:
  bundleIdPrefix: com.ilyas
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Open: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "11"
targets:
  Inkwell:
    type: application
    platform: iOS
    sources:
      - path: Inkwell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilyas.inkwell
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MAC_CATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_ENTITLEMENTS: Inkwell/Inkwell.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inkwell
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Inkwell reads your calendar to suggest notebooks for your lectures and events."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        DEVELOPMENT_TEAM: J7AX8JXB5B
      configs:
        Open:
          # Open-source build: no iCloud entitlement, so anyone can sign it with a free Apple ID or ship it unsigned.
          CODE_SIGN_ENTITLEMENTS: Inkwell/InkwellOpen.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPEN_BUILD"
    info:
      path: Inkwell/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.ilyas.inkwell.refresh]
        NSLocalNetworkUsageDescription: Inkwell sends the page you're writing straight to Claude on your Mac when they're on the same Wi-Fi, so it can see it right away.
        NSBonjourServices: [_inkwell._tcp]
        NSUbiquitousContainers:
          iCloud.com.ilyas.inkwell:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Inkwell
            NSUbiquitousContainerSupportedFolderLevels: Any
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
